    <p class="noprint note" style="padding:0 18px">Dans la fenêtre d'impression, choisis « Enregistrer en PDF ». ${IS_IOS?"Sur iPhone, ouvre l'app dans Safari si l'impression ne s'ouvre pas.":""}</p>
    <div class="page cover"><div class="mono">Liber Degustationum</div><h1><span class="tall">In Vino</span></h1><div class="script" style="font-size:60px">veritas</div>
      <div class="mono" style="margin-top:40px">Le livre de cave de la confrérie</div><div class="mono">${yrs.length?roman(yrs[0])+(yrs.length>1?" – "+roman(yrs[yrs.length-1]):""):""}</div><div class="mono" style="margin-top:12px">${all.length} vins · ${groupSessions().length} soirées · ${members().length} palais</div></div>
    ${all.map(e=>{const a=avg(e);return `<div class="page wine-page">
      <div class="row-between mono"><span>N° ${pad(nos[e.id])}</span><span>${esc(fmtDate(e.date))}${e.session?" · "+esc(e.session):""}</span></div>
      ${e.photo?`<div class="bk-ph"><img data-photo="${e.photo}" style="display:none" alt=""></div>`:""}
      <h2>${esc(e.name||e.producer||"Sans nom")}</h2><div class="script" style="font-size:36px">${esc(e.appellation||SCRIPT_COLOR[e.color]||"")}</div>
      <div class="bk-spec">${[["Domaine",e.producer],["Millésime",e.vintage],["Région",[e.region,e.country].filter(Boolean).join(", ")],["Cépages",(e.grapes||[]).join(", ")],["Prix",e.price?e.price+" €":""],["Moyenne",a!=null?fmtScore(a)+" / 20":""]].filter(x=>x[1]).map(([k,v])=>`<div><span class="mono">${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
      ${(e.aromas||[]).length?`<p><span class="mono">Arômes</span> ${esc(e.aromas.join(", "))}</p>`:""}
      ${(e.scores||[]).length?`<div class="bk-sc">${e.scores.map(s=>`<div><b>${esc(s.who)}</b> ${s.score!=null?fmtScore(parseFloat(s.score)):"-"}${s.comment?` <i>« ${esc(s.comment)} »</i>`:""}</div>`).join("")}</div>`:""}
      ${e.verdict?`<p class="bk-q">« ${esc(e.verdict)} »</p>`:""}
    </div>`}).join("")}
  </section>`;
};
bind.livre=v=>{ $("[data-print]",v).onclick=async()=>{ toast("Préparation du livre…");
  await Promise.all($$("img[data-photo]",v).map(async i=>{const u=await getPhoto(i.dataset.photo);if(u){i.src=u;i.style.display="";await (i.decode?i.decode().catch(()=>{}):0)}}));
  setTimeout(()=>window.print(),300) } };


/* ============ SONS (synthétisés, aucun fichier) ============ */
const FXCFG={get sound(){return localStorage.getItem("iv_sound")!=="0"},get splash(){return localStorage.getItem("iv_splash")!=="0"},get notif(){return localStorage.getItem("iv_notif")==="1"}};
let AC=null;
function audio(){ if(!FXCFG.sound) return null; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC }catch(e){return null} }
document.addEventListener("pointerdown",()=>{ if(FXCFG.sound&&(!AC||AC.state!=="running")) audio() },{capture:true,passive:true});
/* Les sons sont de vrais enregistrements : son-bouchon.mp3 et son-service.mp3, à côté de index.html.
   Le moment du « POP » est repéré automatiquement dans le fichier (pic de volume) pour tomber pile avec l'animation. */
const SND_FILES={pop:"son-bouchon.mp3",pour:"son-service.mp3"}, SND={};
function loadSnd(k){ if(SND[k]) return SND[k];
  return SND[k]=fetch(SND_FILES[k]).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(ab=>{
    const ac=AC||new (window.AudioContext||window.webkitAudioContext)(); AC=AC||ac;
    return new Promise((res,rej)=>ac.decodeAudioData(ab,res,rej)) }).then(buf=>{
    const d=buf.getChannelData(0); let mx=0,at=0; for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>mx){mx=v;at=i}}
    return {buf,peak:at/buf.sampleRate} }).catch(()=>null) }
function preloadSnd(){ if(FXCFG.sound){ loadSnd("pop"); loadSnd("pour") } }
async function playSnd(k,at,{align="peak",dur=0,vol=1}={}){
  const ac=audio(); if(!ac) return; const s=await loadSnd(k); if(!s) return;
  const src=ac.createBufferSource(), g=ac.createGain(); src.buffer=s.buf; src.connect(g).connect(ac.destination);
  const now=ac.currentTime+.02, target=Math.max(at||now,now);
  let start=align==="peak"?target-s.peak:target, offset=0; if(start<now){offset=now-start;start=now}
  g.gain.setValueAtTime(vol,start);
  if(dur){ const end=start+dur; g.gain.setValueAtTime(vol,end-.35); g.gain.linearRampToValueAtTime(0,end); src.start(start,offset); src.stop(end+.05) }
  else src.start(start,offset);
}
function sndPop(at){ return playSnd("pop",at,{align:"peak"}) }
function sndPour(at,dur=1.9){ return playSnd("pour",at,{align:"start",dur:dur+.3}) }

/* ============ L'ANIMATION : UN TRAIT, UNE BOUTEILLE, UN VERRE ============ */
const BOTTLE_D="M-15 -96H15V-88H12V-34C12 -14 44 -10 44 10V204Q44 212 36 212H-36Q-44 212 -44 204V10C-44 -10 -12 -14 -12 -34V-88H-15Z";
const GLASS_D="M100 330C100 402 118 426 140 426C162 426 180 402 180 330";
function wineTone(color,secret){ if(secret) return "#b3241c"; return color==="blanc"||color==="bulles"||color==="doux"?"#d9b866":color==="rose"?"#e0857c":color==="orange"?"#d4893b":"#b3241c" }
function lineBottle(){
  return `<path class="lb-draw" d="${BOTTLE_D}" fill="none" stroke="#ece6da" stroke-width="1.6" stroke-linejoin="round" pathLength="1"/>
    <path class="lb-draw" d="M-30 60H30M-30 132H30" stroke="#ece6da" stroke-width=".8" opacity=".55" pathLength="1"/>
    <text class="lb-lab" x="0" y="104" text-anchor="middle" font-family="Instrument Serif" font-size="22" fill="#ece6da" letter-spacing="2">IV</text>
    <g class="fx-cork" style="transform-box:fill-box;transform-origin:center"><rect x="-8" y="-118" width="16" height="30" rx="2" fill="#b3241c"/></g>`;
}
function ring(cx,cy,cls){return `<circle class="${cls}" cx="${cx}" cy="${cy}" r="6" fill="none" stroke="#b3241c" stroke-width="1.2" opacity="0" style="transform-box:fill-box;transform-origin:center"/>`}
const anim=(el,kf,opt)=>el?el.animate(kf,Object.assign({fill:"forwards",easing:"cubic-bezier(.3,.7,.2,1)"},opt)):{finished:Promise.resolve()};
function drawLines(root,delay=0,dur=900){ $$(".lb-draw",root).forEach((p,i)=>{p.style.strokeDasharray="1";p.style.strokeDashoffset="1";anim(p,[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:dur,delay:delay+i*120,easing:"cubic-bezier(.6,0,.2,1)"})});
  $$(".lb-lab",root).forEach(t=>anim(t,[{opacity:0},{opacity:1}],{duration:500,delay:delay+dur*.7})) }
function popAt(root,ms,{ac,t0}){
  const cork=$(".fx-cork",root), rings=$$(".fx-ring",root);
  anim(cork,[{transform:"translateY(0)"},{transform:"translateY(-9px)"}],{duration:280,delay:ms-280,easing:"cubic-bezier(.5,0,.8,.4)"});
  if(ac) sndPop(t0+ms/1000);
  setTimeout(()=>{ buzz(15);
    anim(cork,[{transform:"translateY(-9px)",opacity:1},{transform:"translateY(-46px) rotate(-14deg)",opacity:0}],{duration:700,easing:"cubic-bezier(.2,.8,.2,1)"});
    rings.forEach((r,i)=>anim(r,[{transform:"scale(1)",opacity:.9},{transform:`scale(${7+i*4})`,opacity:0}],{duration:1100+i*250,delay:i*120,easing:"cubic-bezier(.1,.7,.3,1)"}));
  },ms);
}
function fxTime(){ const ac=audio(); return {ac:ac&&ac.state==="running"?ac:null,t0:ac?ac.currentTime:0} }

/* ---- ouverture de l'appli : se lance toute seule ---- */
function splashOpen(){
  if(!FXCFG.splash||sessionStorage.getItem("iv_splashed")||REDUCED) return;
  sessionStorage.setItem("iv_splashed","1");
  const m=document.createElement("div"); m.className="fx fx-splash";
  m.innerHTML=`<svg viewBox="0 0 400 600" class="fx-svg"><g transform="translate(200 330) scale(1.05)">${lineBottle()}${ring(0,-104,"fx-ring")}${ring(0,-104,"fx-ring")}</g></svg>
    <div class="fx-title"><div class="mono b">Liber Degustationum</div><h1><span class="tall">In Vino</span></h1><div class="script">veritas</div></div>`;
  document.body.appendChild(m);
  const go2=()=>{ const T=fxTime(); drawLines(m,100,900); popAt(m,1350,T);
    setTimeout(()=>m.classList.add("opened"),1500);
    setTimeout(()=>{ m.classList.add("bye"); setTimeout(()=>{m.remove(); if(route.name==="cave"){INTRO=true;render()}},650) },2700) };
  // le son ne peut partir que si le téléphone l'autorise (appli installée sur Android) ; sinon l'animation joue en silence
  const ac=audio(); if(ac&&ac.state!=="running"){ Promise.race([ac.resume(),new Promise(r=>setTimeout(r,120))]).then(go2) } else go2();
  m.onclick=()=>{ m.classList.add("bye"); setTimeout(()=>m.remove(),400) };
}

/* ---- on débouche et on sert ---- */
function pourFX({color="rouge",title="",sub="",secret=false}={}){
  if(REDUCED){ sndPop(); return }
  const wine=wineTone(color,secret);
  const m=document.createElement("div"); m.className="fx fx-pour";
  m.innerHTML=`<svg viewBox="0 0 400 520" class="fx-svg">
      <defs><clipPath id="fxBowl"><path d="${GLASS_D}Z"/></clipPath></defs>
      <g clip-path="url(#fxBowl)"><g class="fx-fill" style="transform:translateY(60px)"><path class="fx-wave" d="M60 372q15 -4 30 0t30 0t30 0t30 0t30 0t30 0V440H60Z" fill="${wine}" opacity=".92"/></g></g>
      <path class="lb-draw" d="${GLASS_D}" fill="none" stroke="#ece6da" stroke-width="1.6" pathLength="1"/>
      <path class="lb-draw" d="M140 426V476M114 478H166" fill="none" stroke="#ece6da" stroke-width="1.6" pathLength="1"/>
      ${ring(140,372,"fx-ring2")}
      <line class="fx-stream" x1="140" y1="300" x2="140" y2="418" stroke="${wine}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="120"/>
      <g class="fx-bot" style="transform-box:view-box;transform-origin:0 0;transform:translate(272px,236px) rotate(0deg) translate(0px,-80px) scale(.8)">${lineBottle()}${ring(0,-104,"fx-ring")}</g></svg>
    <div class="fx-caption"><div class="mono b">${esc(sub)}</div><h2><span class="tall">${esc(title)}</span></h2></div>`;
  document.body.appendChild(m);
  const T=fxTime(), q=s=>$(s,m), timers=[];
  const bot=q(".fx-bot"), stream=q(".fx-stream"), fill=q(".fx-fill"), wave=q(".fx-wave"), r2=q(".fx-ring2");
  const up="translate(272px,236px) rotate(0deg) translate(0px,-80px) scale(.8)", tilt="translate(277px,266px) rotate(-104deg) translate(0px,-80px) scale(.8)";
  drawLines(m,0,700);
  popAt(m,950,T);
  if(T.ac) sndPour(T.t0+2.0,1.7);
  timers.push(setTimeout(()=>anim(bot,[{transform:up},{transform:tilt}],{duration:700,easing:"cubic-bezier(.6,0,.2,1)"}),1350));
  timers.push(setTimeout(()=>{ anim(stream,[{strokeDashoffset:120},{strokeDashoffset:0}],{duration:280,easing:"ease-in"});
    anim(fill,[{transform:"translateY(60px)"},{transform:"translateY(0px)"}],{duration:1600,delay:150,easing:"cubic-bezier(.3,.2,.3,1)"});
    anim(wave,[{transform:"translateX(0)"},{transform:"translateX(-60px)"}],{duration:1400,iterations:3,easing:"linear"});
    anim(r2,[{transform:"scale(1)",opacity:.6},{transform:"scale(6)",opacity:0}],{duration:1000,delay:1500,easing:"ease-out"});
  },2000));
  timers.push(setTimeout(()=>{ anim(stream,[{strokeDashoffset:0},{strokeDashoffset:-120}],{duration:300,easing:"ease-out"}); anim(bot,[{transform:tilt},{transform:up}],{duration:650,easing:"cubic-bezier(.6,0,.2,1)"}) },3650));
  timers.push(setTimeout(()=>{ m.classList.add("bye"); setTimeout(()=>m.remove(),600) },4300));
  m.onclick=()=>{ timers.forEach(clearTimeout); m.classList.add("bye"); setTimeout(()=>m.remove(),400) };
}

/* ============ NOTIFICATIONS ============ */
let LOCAL_SERVES=new Set();
function notifBanner(title,body,go2){
  const n=document.createElement("div"); n.className="notif";
  n.innerHTML=`<svg viewBox="0 0 40 40" width="34" height="34"><circle cx="20" cy="20" r="19" fill="#2a0809" stroke="rgba(236,230,218,.3)"/><rect x="16" y="6" width="8" height="10" rx="1.5" fill="#c9a06a"/><path d="M15 16h10v4c0 2 5 3 5 7v8H10v-8c0-4 5-5 5-7z" fill="#7a0f19"/></svg>
    <div><div class="mono b">${esc(title)}</div><div class="nb">${esc(body)}</div></div>`;
  n.onclick=()=>{n.remove();go2&&go2()};
  document.body.appendChild(n); setTimeout(()=>n.classList.add("out"),5200); setTimeout(()=>n.remove(),5800);
}
async function notifyUser(title,body,go2,tag){
  sndPop(); buzz([40,30,40]);
  if(document.visibilityState==="visible") return notifBanner(title,body,go2);
  if(FXCFG.notif&&"Notification" in window&&Notification.permission==="granted"){
    try{ const r=await navigator.serviceWorker.ready; await r.showNotification(title,{body,tag,icon:"icon-192.png",badge:"icon-192.png",vibrate:[60,40,60],renotify:true,data:{url:location.pathname}}) }
    catch(e){ try{ new Notification(title,{body,icon:"icon-192.png"}) }catch(_){} }
  }
}
// appelé par la synchro : détecte ce que les autres ont ajouté
function detectChanges(before,prevCur){
  if(!before.size) return; // première synchro d'un téléphone : on ne notifie pas tout l'historique
  const me=player(), fresh=Date.now()-24*3600e3;
  const vis=new Set(entries().map(e=>e.id));
  const added=Object.values(S.entries).filter(e=>!before.has(e.id)&&vis.has(e.id)&&!e.deleted&&e.session&&new Date(e.createdAt).getTime()>fresh&&!(e.by&&same(e.by,me))&&!(e.blind&&same(e.blind.by,me)));
  if(added.length===1){ const e=added[0], who=(e.blind&&e.blind.by)||e.by||"Quelqu'un";
    notifyUser(`${who} a ajouté une bouteille`, e.blind&&!e.blind.revealed?`Une bouteille mystère pour « ${e.session} »`:`${e.name||e.producer} · ${e.session}`, ()=>go("soiree",sessionKey(e)), "add-"+e.id) }
  else if(added.length>1){ const s=added[0].session; notifyUser(`${added.length} nouvelles bouteilles`,`Pour « ${s} »`,()=>go("soiree",sessionKey(added[0])),"add-many") }
  const myK=new Set(mySoireesRaw().map(so=>so.key));
  for(const g of Object.values(S.games)){ if(g.deleted||!g.cur||g.cur===prevCur[g.id]||LOCAL_SERVES.has(g.cur)||!myK.has(g.sess)) continue;
    const e=S.entries[g.cur]; if(!e||!e.blind||e.blind.revealed) continue; LOCAL_SERVES.add(g.cur);
    if(route.name==="jeu"&&route.id===g.id&&document.visibilityState==="visible") pourFX({secret:true,title:`Bouteille de ${e.blind.by}`,sub:"On sert"});
    else notifyUser("On sert !",`La bouteille de ${e.blind.by} est dans les verres`,()=>go("jeu",g.id),"serve-"+g.id) }
}
async function askNotif(){
  if(!("Notification" in window)) return toast(IS_IOS?"Installe d'abord l'app sur l'écran d'accueil (iOS 16.4 ou plus)":"Notifications non disponibles ici");
  const p=await Notification.requestPermission();
  if(p==="granted"){ localStorage.setItem("iv_notif","1"); toast("Notifications activées"); sndPop() } else { localStorage.setItem("iv_notif","0"); toast("Notifications refusées") }
  render(true);
}

/* ============ INVITATION ============ */
async function handleInvite(src){
  const fromHash=typeof src!=="string";
  const m=(fromHash?location.hash:src).match(/invite=([\w-]+)/); if(!m){ if(!fromHash) toast("Ce n'est pas un lien d'invitation"); return }
  if(fromHash) history.replaceState({name:route.name,id:route.id},"",location.pathname);
  let cfg, soId=null; try{const s=m[1].replace(/-/g,"+").replace(/_/g,"/");const j=JSON.parse(decodeURIComponent(escape(atob(s))));cfg={owner:j.o,repo:j.r,branch:j.b||"main",token:j.t};soId=j.s||null}catch(e){toast("Lien d'invitation invalide");return}
  const wl=$(".welcome"); if(wl) wl.remove();
  const md=document.createElement("div");md.className="modal";
  md.innerHTML=`<div class="sheet form"><div class="mono">Invitation</div><h3>${soId?"Rejoindre la soirée":"Rejoindre tes amis"}</h3><p class="note">${soId?"Un ami t'invite à sa soirée de dégustation.":"Un ami t'invite à partager vos soirées de dégustation."} Dis-nous qui tu es.</p>
    <div class="field"><input type="text" id="invMe" placeholder="Ton prénom" value="${esc(ME)}" autocomplete="off"></div>
    <div class="actions"><button class="btn ghost" data-x>Plus tard</button><button class="btn red" data-ok>Entrer</button></div></div>`;
  md.onclick=ev=>{if(ev.target.dataset.x!==undefined)closeModal()};
  $("[data-ok]",md).onclick=async()=>{const n=$("#invMe",md).value.trim(); if(!n) return toast("Tape ton prénom"); setME(n); await closeModal();
    const sameNet=CFG&&CFG.owner===cfg.owner&&CFG.repo===cfg.repo; if(sameNet) await sync(); else await linkRepo(cfg);
    ensureMember(ME); if(soId){ addAttendRaw(soId,ME) } await saveLocal(); scheduleSync();
    const so=soId&&S.soirees[soId]; if(so){ toast("Bienvenue à « "+so.name+" »"); go("soiree",so.key) } else render(true)};
  openModal(md);
}

/* ============ BIENVENUE : création de l'espace personnel ============ */
function welcome(){
  if(ME||$(".welcome")) return;
  const w=document.createElement("div"); w.className="welcome";
  w.innerHTML=`<div class="wl-in form">
    <div class="mono b">Liber Degustationum</div>
    <h1><span class="tall">In Vino</span></h1><div class="script">bienvenue</div>
    <p class="lead" style="text-align:center">Ton carnet de dégustation personnel. Crée tes soirées et invites-y tes amis.</p>
    <div class="field"><label class="mono">Ton prénom</label><input type="text" id="wlName" placeholder="Jean-Max" autocomplete="given-name"></div>
    <div class="actions"><button class="btn red" id="wlGo">Créer mon espace</button></div>
    <div class="rule mono">ou</div>
    <div class="field"><label class="mono">J'ai reçu un lien d'invitation</label><input type="text" id="wlInv" placeholder="Colle le lien ici" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="actions"><button class="btn" id="wlJoin">Rejoindre</button></div></div>`;
  document.body.appendChild(w);
  $("#wlGo",w).onclick=async()=>{const n=$("#wlName",w).value.trim(); if(!n) return toast("Tape ton prénom"); setME(n); await saveLocal(); scheduleSync(); w.classList.add("out"); setTimeout(()=>w.remove(),500); render(); toast("Bienvenue, "+n+" !")};
  $("#wlName",w).onkeydown=e=>{if(e.key==="Enter")$("#wlGo",w).click()};
  $("#wlJoin",w).onclick=()=>handleInvite($("#wlInv",w).value.trim());
}

/* ============ DÉMARRAGE ============ */
(async()=>{
  preloadSnd();
  splashOpen();
  await loadLocal();
  if(ensureSoireeObjects()){ await saveLocal(); setTimeout(scheduleSync,2000) }
  history.replaceState({name:"cave",id:null},"");
  render();
  if(location.hash==="#nouveau"){history.replaceState({name:"cave",id:null},"",location.pathname);go("edit")}
  else if(location.hash==="#carte"){history.replaceState({name:"cave",id:null},"",location.pathname);go("carte")}
  if(!/invite=/.test(location.hash)) welcome();
  handleInvite();
  window.addEventListener("hashchange",handleInvite);
  if(CFG) sync();
  window.addEventListener("online",()=>sync());
  window.addEventListener("offline",()=>setSync());
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&CFG)sync()});
  setInterval(()=>{if(!syncing)setSync()},30000);
  setInterval(()=>{ if(CFG&&!syncing&&document.visibilityState==="visible"&&(route.name==="jeu"||route.name==="soiree")) sync() },6000);
  setInterval(()=>{ if(CFG&&!syncing&&document.visibilityState==="visible") sync() },90000);
  setInterval(()=>{ if(CFG&&!syncing&&document.visibilityState==="hidden"&&FXCFG.notif) sync() },60000);
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
